name: CI

# Fast quality gate on every push / PR: unit tests + Terraform fmt/validate.
# (The figures-commit from the pipeline uses "[skip ci]" so it won't trigger this.)
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pytest
      - run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  # Catch broken *relative* links in the docs (offline → no flaky external-host checks).
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress ./README.md ./ARCHITECTURE.md ./terraform/README.md"
          fail: true

# NOTE: a terraform-docs auto-commit job was removed — pushing a bot commit back to main on
# every push left local branches behind and forced force-pushes. The variables/outputs tables
# in terraform/README.md (generated once) stay as static docs; regenerate manually if needed:
#   terraform-docs markdown table --output-file README.md --output-mode inject terraform/
