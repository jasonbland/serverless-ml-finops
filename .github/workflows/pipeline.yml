name: ML-FinOps Pipeline

# Manual trigger shows an input form. The daily schedule POLLS for cost data (which lags
# ~24-48h): it exits quietly until Cost Explorer has ingested the tagged usage, then
# generates figures, commits them + the CSVs, uploads the artifact, and opens a GitHub
# issue to notify you — no approval needed.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options: [load-test, cost-query, all, figures]
        default: load-test
      requests:
        description: "load-test: number of requests"
        type: string
        default: "20000"
      concurrency:
        description: "load-test: concurrency"
        type: string
        default: "20"
      predictions:
        description: "cost-query: predictions served (for the per-1,000 figure)"
        type: string
        default: "20000"
      start_date:
        description: "cost-query: start YYYY-MM-DD (blank = 7 days ago)"
        type: string
        default: ""
      end_date:
        description: "cost-query: end YYYY-MM-DD (blank = tomorrow)"
        type: string
        default: ""
  schedule:
    - cron: "0 14 * * *" # daily 14:00 UTC — poll for cost data, build/commit figures, notify

permissions:
  contents: write # commit figures + CSVs back to the repo
  id-token: write # AWS OIDC
  issues: write # open the "data ready" notification issue

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # --- Load test (no AWS auth; hits the public endpoint) ---
      - name: Generate load
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.action == 'load-test' || inputs.action == 'all') }}
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          test -n "$API_URL" || { echo "Set the repo Actions variable API_URL first."; exit 1; }
          python scripts/load_test.py --url "$API_URL" -n "${{ inputs.requests }}" -c "${{ inputs.concurrency }}"
          echo "::notice::Load generated. The daily poll will capture the cost once Cost Explorer ingests it (~24-48h)."

      # --- OIDC (no stored keys). Needed by the metrics summary (load-test/all) and the
      #     cost query (schedule/cost-query/all). Best-effort for load-test so a metrics
      #     auth problem never fails the load (the cost path keeps it fatal). ---
      - name: Assume AWS role via OIDC
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'load-test' || inputs.action == 'cost-query' || inputs.action == 'all')) }}
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'load-test' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      # --- Monitoring readout: pull CloudWatch metrics for the run → Actions job summary.
      #     Best-effort: skipped automatically if the assume above didn't yield creds. ---
      - name: Metrics summary (post load test)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.action == 'load-test' || inputs.action == 'all') }}
        continue-on-error: true
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "No AWS credentials (OIDC assume did not succeed) — skipping metrics readout."
            echo "⚠️ Metrics summary skipped: OIDC assume failed. Load test still ran; cost data is accruing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pip install -q boto3
          echo "Waiting ~90s for CloudWatch metric propagation..."
          sleep 90
          python scripts/metrics_summary.py --minutes 20 --api-url "$API_URL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Query Cost Explorer (gated — exit 2 until data lands)
        id: cost
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'cost-query' || inputs.action == 'all')) }}
        run: |
          pip install -q -r scripts/requirements.txt
          set +e
          python scripts/cost_query.py --gate \
            --predictions "${{ inputs.predictions || '20000' }}" \
            ${{ inputs.start_date != '' && format('--start {0}', inputs.start_date) || '' }} \
            ${{ inputs.end_date != '' && format('--end {0}', inputs.end_date) || '' }}
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "2" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cost data not ready yet — the next daily poll will retry."
          else
            echo "cost_query.py failed (exit $code)"; exit "$code"
          fi

      # --- Figures (matplotlib; no AWS). Runs when cost data landed, or on the manual 'figures' action. ---
      - name: Generate figures
        id: figs
        if: ${{ steps.cost.outputs.ready == 'true' || (github.event_name == 'workflow_dispatch' && inputs.action == 'figures') }}
        run: |
          pip install -q matplotlib
          python scripts/make_figures.py

      - name: Upload CSVs + figures artifact
        if: ${{ steps.cost.outputs.ready == 'true' || (github.event_name == 'workflow_dispatch' && inputs.action == 'figures') }}
        uses: actions/upload-artifact@v4
        with:
          name: cost-results
          path: |
            dashboards/*.csv
            dashboards/*.png
          if-no-files-found: warn

      - name: Commit figures + CSVs to repo
        if: ${{ steps.cost.outputs.ready == 'true' || (github.event_name == 'workflow_dispatch' && inputs.action == 'figures') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboards/
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "chore(ci): update cost figures + CSVs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Notify — open a one-time issue when data lands
        if: ${{ steps.cost.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="✅ FinOps cost data is ready"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body \
              "Cost Explorer has ingested the tagged usage. The latest run committed \`dashboards/*.png\` + \`*.csv\` and uploaded the **cost-results** artifact. View the figures in the repo, pull the numbers for the Final. Close this once collected."
          else
            echo "Issue #$existing already open — not duplicating."
          fi
